<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay2Win B2B</title>
  <style>
    :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#059669; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color:var(--ink); background:#f8fafc; }
    header { background:var(--ink); color:#fff; padding:20px 28px; }
    header h1 { margin:0; font-size:20px; }
    header p { margin:4px 0 0; color:#94a3b8; font-size:13px; }
    main { padding:24px 28px; display:grid; gap:20px; grid-template-columns: 380px 1fr; align-items:start; }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
    .card h2 { margin:0 0 12px; font-size:15px; }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
    input, select, textarea, button { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:9px; font:inherit; background:#fff; }
    textarea { min-height:64px; resize:vertical; }
    button { cursor:pointer; border:0; background:var(--ink); color:#fff; margin-top:14px; }
    button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
    button.approve { background:var(--accent); margin:0; padding:5px 8px; width:auto; font-size:12px; }
    .qr { text-align:center; margin-top:14px; }
    .qr img { width:200px; height:200px; }
    .hint { font-size:12px; color:var(--muted); line-height:1.5; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:600; background:#f1f5f9; }
    .pill.completed { background:#dcfce7; color:#166534; }
    .pill.pending { background:#fef3c7; color:#92400e; }
    .pill.rejected { background:#fee2e2; color:#991b1b; }
    .row { display:flex; align-items:center; gap:8px; }
  </style>
</head>
<body>
<header>
  <h1>Pay2Win B2B · procurement team</h1>
  <p>Delegas un presupuesto firmado en un QR. El supervisor reparte el trabajo entre subagentes de compras, aduana, logística, compliance, tesorería y pagos.</p>
</header>
<main>
  <section class="card">
    <h2>Delegar presupuesto</h2>
    <label>Objetivo de compra</label>
    <textarea id="objective">Compra 20 laptops empresariales y 10 monitores 4K para la nueva oficina</textarea>
    <label>Presupuesto total (USD)</label>
    <input id="budget" type="number" value="50000" min="1" step="100" />
    <label>Tope por ítem (USD)</label>
    <input id="cap" type="number" value="1500" min="1" step="50" />
    <label>Financiamiento</label>
    <select id="financing">
      <option value="pay_in_4">Pay Later (4 cuotas)</option>
      <option value="none">Pago directo</option>
    </select>
    <button id="create">Generar QR de delegación</button>
    <div id="result" class="hint"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2>Control de pagos</h2>
      <button class="ghost" style="width:auto;margin:0" onclick="load()">Refrescar</button>
    </div>
    <div id="orders" class="hint">Cargando…</div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const money = v => '$' + Number(v || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const LABEL = { completado:'Completado', esperando_aprobacion:'Esperando aprobación', rechazado:'Rechazado',
  cancelado:'Cancelado', error:'Error', error_captura:'Fallo captura', delegado:'Delegado' };

$('create').onclick = async () => {
  const p = new URLSearchParams({
    objective: $('objective').value,
    budget: $('budget').value,
    per_item_cap: $('cap').value,
    financing: $('financing').value,
  });
  $('result').textContent = 'Creando mandato…';
  try {
    const r = await fetch('/api/b2b/qr?' + p).then(r => r.json());
    if (!r.png) throw new Error(r.detail || 'sin QR');
    $('result').innerHTML = `<div class="qr"><img src="${r.png}" alt="QR mandato"/></div>
      <p>${r.objective}<br>Presupuesto ${money(r.budget)} · tope ${money(r.per_item_cap)} · ${r.scope.length} subagentes</p>
      <button id="scan" style="margin-top:8px">Escanear y ejecutar</button>`;
    $('scan').onclick = async () => {
      $('result').innerHTML = '<p>El equipo está trabajando…</p>';
      const row = await fetch('/api/b2b/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: r.token }) }).then(r => r.json());
      showRun(row);
    };
  } catch (e) { $('result').textContent = 'Error: ' + e.message; }
};

function showRun(row) {
  if (!row || row.detail) { $('result').textContent = 'Error: ' + (row && row.detail); return; }
  let html = `<p><b>${LABEL[row.status] || row.status}</b> · ${money(row.grand_total)} de ${money(row.budget)}</p>`;
  if (row.approve_url) {
    html += `<a href="${row.approve_url}" target="_blank" rel="noreferrer">Abrir aprobación en PayPal</a>`;
    html += `<button id="approve" style="margin-top:10px">Ya aprobé en PayPal → capturar</button>`;
  }
  if (row.trace) html += '<ul>' + row.trace.map(t => `<li><b>${t.agent}</b>: ${t.summary}</li>`).join('') + '</ul>';
  $('result').innerHTML = html;
  const b = $('approve');
  if (b) b.onclick = async () => {
    b.disabled = true;
    const done = await fetch('/api/b2b/approve/' + row.thread_id, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ approved:true }) }).then(r => r.json());
    showRun(done); load();
  };
  load();
}

async function load() {
  try {
    const rows = await fetch('/api/b2b/orders').then(r => r.json());
    if (!rows.length) { $('orders').textContent = 'Todavía no hay delegaciones.'; return; }
    $('orders').innerHTML = `<table><thead><tr>
      <th>Hora</th><th>Objetivo</th><th>Unidades</th><th>Bienes</th><th>Aduana</th><th>Envío</th>
      <th>Total</th><th>Saldo</th><th>Estado</th><th></th></tr></thead><tbody>` +
      rows.map(r => `<tr>
        <td>${r.created || ''}</td>
        <td>${r.objective || ''}</td>
        <td>${r.items_count || 0}</td>
        <td>${money(r.goods_total)}</td>
        <td>${money((r.duties_total||0)+(r.tax_total||0))}</td>
        <td>${money(r.shipping_total)}</td>
        <td><b>${money(r.grand_total)}</b></td>
        <td>${money(r.remaining)}</td>
        <td><span class="pill ${r.status === 'completado' ? 'completed' : r.status === 'esperando_aprobacion' ? 'pending' : r.status === 'rechazado' ? 'rejected' : ''}">${LABEL[r.status] || r.status}</span></td>
        <td>${r.approve_url && r.status === 'esperando_aprobacion' ? `<button class="approve" onclick="approve('${r.thread_id}')">Aprobar</button>` : ''}</td>
      </tr>`).join('') + '</tbody></table>';
  } catch (e) { $('orders').textContent = 'Error: ' + e.message; }
}

window.approve = async tid => {
  const done = await fetch('/api/b2b/approve/' + tid, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ approved:true }) }).then(r => r.json());
  showRun(done);
};
load();
setInterval(load, 4000);
</script>
</body>
</html>
